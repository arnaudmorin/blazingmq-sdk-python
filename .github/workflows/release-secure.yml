name: Release (secure)

# NOTE(arnaud) authentication and TLS are not released upstream yet: build the
# wheel of the secure branch for the OpenStack images and packages (Python 3.13,
# x86_64) and publish it as a GitHub release of this fork
on:
  push:
    branches:
      - secure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: Wheel for Linux-cp313-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disable ptrace security restrictions
        run: |
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      - name: Build wheel
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: cp313-*
          CIBW_TEST_COMMAND: python3 -m pytest {project}/tests/unit
          CIBW_TEST_REQUIRES: pytest mock pkgconfig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: ./wheelhouse/*.whl

  release:
    needs: wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # NOTE(arnaud) keep the upstream version in the wheel (it is sent in
          # the user agent, limited in length): the commit is in the tag only,
          # e.g. v1.2.3-secure.4650e0a
          TAG="v$(ls blazingmq-*.whl | cut -d- -f2)-secure.${GITHUB_SHA::7}"
          echo "Will do a release $TAG with a tag on $GITHUB_SHA"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --notes "Wheel of the secure branch (authentication and TLS)" *.whl
